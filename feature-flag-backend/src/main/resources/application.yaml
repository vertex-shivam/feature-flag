
spring:
  application:
    name: feature-flag-backend

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/feature_flag_db}
    username: ${DB_USERNAME:featureadmin}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true

server:
  port: 8080

jwt:
  secret: ${JWT_SECRET}
  expiration: 86400000
