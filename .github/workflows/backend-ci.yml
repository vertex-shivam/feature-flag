
name: Backend CI

on:
  push:
    branches:
      - development
    paths:
      - "feature-flag-backend/**"
      - ".github/workflows/backend-ci.yml"

  pull_request:
    branches:
      - development
    paths:
      - "feature-flag-backend/**"
      - ".github/workflows/backend-ci.yml"

  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: feature-flag-backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: feature-flag-backend/pom.xml

      - name: Build and test backend
        run: |
          chmod +x mvnw
          ./mvnw -B clean verify
