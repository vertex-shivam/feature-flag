
name: Backend CI

on:
  push:
    branches:
      - development
    paths:
      - "feature-flag-backend/**"
      - ".github/workflows/backend-ci.yml"

  pull_request:
    branches:
      - development
    paths:
      - "feature-flag-backend/**"
      - ".github/workflows/backend-ci.yml"

  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: feature_flag
          POSTGRES_USER: feature_flag_user
          POSTGRES_PASSWORD: ci_test_password
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U feature_flag_user -d feature_flag"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: feature-flag-backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: feature-flag-backend/pom.xml

      - name: Build and test backend
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5433/feature_flag
          SPRING_DATASOURCE_USERNAME: feature_flag_user
          SPRING_DATASOURCE_PASSWORD: ci_test_password
        run: |
          chmod +x mvnw
          ./mvnw -B clean verify
