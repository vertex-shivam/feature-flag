
name: Backend CI

on:
  push:
    branches:
      - development
    paths:
      - "feature-flag-backend/**"
      - ".github/workflows/backend-ci.yml"

  pull_request:
    branches:
      - development
    paths:
      - "feature-flag-backend/**"
      - ".github/workflows/backend-ci.yml"

  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: feature_flag_db
          POSTGRES_USER: featureadmin
          POSTGRES_PASSWORD: ci_test_password
        ports:
          - "5433:5432"
        options: >-
          --health-cmd "pg_isready -U featureadmin -d feature_flag_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: feature-flag-backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: feature-flag-backend/pom.xml

      - name: Build and test backend
        env:
          DB_URL: jdbc:postgresql://localhost:5433/feature_flag_db
          DB_USERNAME: featureadmin
          DB_PASSWORD: ci_test_password
          JWT_SECRET: VGhpc0lzQVN1cGVyU2VjcmV0S2V5Rm9yQ0lUZXN0aW5nMTIzNDU2Nzg=
        run: |
          chmod +x mvnw
          ./mvnw -B clean verify
