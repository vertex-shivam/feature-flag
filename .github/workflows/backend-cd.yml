
name: Backend CD

on:
  push:
    branches:
      - development
    paths:
      - "feature-flag-backend/**"
      - ".github/workflows/backend-cd.yml"

  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish-image:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: feature-flag-backend/pom.xml

      - name: Build backend JAR
        working-directory: feature-flag-backend
        run: |
          chmod +x mvnw
          ./mvnw -B clean package -DskipTests

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./feature-flag-backend
          push: true
          tags: |
            ghcr.io/vertex-shivam/feature-flag-backend:latest
            ghcr.io/vertex-shivam/feature-flag-backend:${{ github.sha }}

  deploy:
    name: Deploy to Linux server
    runs-on: ubuntu-latest
    needs: publish-image

    steps:
      - name: Connect to Tailscale
        uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}

      - name: Set up SSH
        env:
          DEPLOY_SSH_KEY_B64: ${{ secrets.DEPLOY_SSH_KEY_B64 }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s' "$DEPLOY_SSH_KEY_B64" | base64 --decode > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts
          
      - name: Deploy backend
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          ssh -i ~/.ssh/deploy_key \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "cd /home/vertex_white_admin/apps/feature-flag-backend && docker compose pull feature-flag-api && docker compose up -d --no-deps feature-flag-api"
            
