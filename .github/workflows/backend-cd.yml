
name: Backend CD

on:
  push:
    branches:
      - development
    paths:
      - "feature-flag-backend/**"
      - ".github/workflows/backend-cd.yml"

  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish-image:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: feature-flag-backend/pom.xml

      - name: Build backend JAR
        working-directory: feature-flag-backend
        run: |
          chmod +x mvnw
          ./mvnw -B clean package -DskipTests

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./feature-flag-backend
          push: true
          tags: |
            ghcr.io/vertex-shivam/feature-flag-backend:latest
            ghcr.io/vertex-shivam/feature-flag-backend:${{ github.sha }}
